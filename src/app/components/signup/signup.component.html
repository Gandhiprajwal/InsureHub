<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-brand">
      <span class="dot"><i class="bi bi-shield-fill-check"></i></span>
      InsureHub
    </div>
    <h4 class="mb-1" style="font-weight:700;letter-spacing:-.01em">Create your account</h4>
    <p class="text-muted-2 mb-4">Choose your role to get started.</p>

    <div class="role-toggle">
      <button [class.active]="role() === 'agent'" (click)="role.set('agent')">
        <i class="bi bi-briefcase-fill me-1"></i> Agent
      </button>
      <button [class.active]="role() === 'customer'" (click)="role.set('customer')">
        <i class="bi bi-person-fill me-1"></i> Customer
      </button>
    </div>

    <form (ngSubmit)="submit()" #f="ngForm">
      <div class="mb-3">
        <label class="form-label">Full name</label>
        <input class="form-control" name="name" [(ngModel)]="name" required />
      </div>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input class="form-control" type="email" name="email" [(ngModel)]="email" required />
      </div>
      <div class="mb-3">
        <label class="form-label">Phone</label>
        <input class="form-control" name="phone" [(ngModel)]="phone" />
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input class="form-control" type="password" name="password" [(ngModel)]="password" required minlength="4" />
      </div>

      @if (role() === 'customer') {
        <div class="mb-3">
          <label class="form-label">Agent ID</label>
          <input class="form-control" name="agentId" [(ngModel)]="agentId" required placeholder="e.g. AGT001" />
          <div class="text-muted-2" style="font-size:.8rem;margin-top:.35rem">
            Ask your agent for their ID, or try <strong>AGT001</strong>.
          </div>
        </div>
      }

      @if (error()) {
        <div class="alert alert-danger py-2" role="alert">{{ error() }}</div>
      }

      <button type="submit" class="btn btn-primary w-100 py-2" [disabled]="!f.valid">
        Create account
      </button>
    </form>

    <div class="divider"></div>
    <div class="text-center text-muted-2" style="font-size:.9rem">
      Already have an account?
      <a routerLink="/login" style="color:var(--ih-primary);font-weight:600">Sign in</a>
    </div>
  </div>
</div>
