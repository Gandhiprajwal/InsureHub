<app-navbar />
<div class="ih-shell">
  <button class="btn btn-sm btn-outline-secondary mb-3" (click)="back()">
    <i class="bi bi-arrow-left"></i> Back to dashboard
  </button>

  <div *ngIf="customer() as c">
    <div class="ih-card mb-4">
      <div class="d-flex align-items-center justify-content-between flex-wrap gap-3">
        <div class="d-flex align-items-center gap-3 flex-wrap">
          <div class="ih-avatar" style="width:64px;height:64px;font-size:1.4rem">{{ c.name | appInitials }}</div>
          <div>
            <h3 class="mb-1" style="font-weight:700">{{ c.name }}</h3>
            <div class="text-muted-2 d-flex flex-wrap align-items-center gap-x-2 gap-y-1">
              <span><i class="bi bi-envelope-fill me-1"></i> {{ c.email }}</span>
              <span class="d-none d-sm-inline">·</span>
              <span><i class="bi bi-telephone-fill me-1"></i> {{ c.phone | appPhone }}</span>
            </div>
          </div>
        </div>
        <div class="text-start text-sm-end">
          <div class="text-muted-2" style="font-size:.8rem">Total Premium / yr</div>
          <div style="font-weight:700;font-size:1.4rem">₹{{ totalPremium() | number:'1.0-0' }}</div>
        </div>
      </div>
    </div>

    <h5 style="font-weight:700;margin-bottom:.75rem">Policies</h5>
    <app-policy-list [policies]="policies()" [readonly]="true" />
  </div>
  
  <div *ngIf="!customer()" class="empty-state">Customer not found.</div>
</div>
