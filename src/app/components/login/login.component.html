<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-brand">
      <span class="dot"><i class="bi bi-shield-fill-check"></i></span>
      InsureHub
    </div>

    <!-- Step 1: Input Credentials -->
    <div *ngIf="step() === 1">
      <h4 class="mb-1" style="font-weight:700;letter-spacing:-.01em">Welcome back</h4>
      <p class="text-muted-2 mb-4">Sign in to manage your policies.</p>

      <div class="role-toggle">
        <button type="button" [class.active]="role() === 'AGENT'" (click)="role.set('AGENT')">
          <i class="bi bi-briefcase-fill me-1"></i> Agent
        </button>
        <button type="button" [class.active]="role() === 'CUSTOMER'" (click)="role.set('CUSTOMER')">
          <i class="bi bi-person-fill me-1"></i> Customer
        </button>
      </div>

      <form (ngSubmit)="submitLogin()" #loginForm="ngForm">
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input class="form-control" type="email" name="email" [(ngModel)]="email" required placeholder="name@example.com" />
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input class="form-control" type="password" name="password" [(ngModel)]="password" required placeholder="••••••••" />
        </div>

        <div *ngIf="error()" class="alert alert-danger py-2" role="alert">{{ error() }}</div>

        <button type="submit" class="btn btn-primary w-100 py-2" [disabled]="!loginForm.valid || sendingOtp()">
          <span *ngIf="sendingOtp()">
            <span class="spinner-border spinner-border-sm me-1"></span> Sending OTP...
          </span>
          <span *ngIf="!sendingOtp()">
            Sign in as {{ role() === 'AGENT' ? 'Agent' : 'Customer' }}
          </span>
        </button>
      </form>
    </div>

    <!-- Step 2: Input OTP Verification -->
    <div *ngIf="step() === 2">
      <h4 class="mb-1" style="font-weight:700;letter-spacing:-.01em">Security Check</h4>
      <p class="text-muted-2 mb-4">For your security, we've sent a 6-digit OTP code to <strong>{{ email }}</strong>.</p>

      <form (ngSubmit)="verifyAndLogin()">
        <div class="mb-3">
          <label class="form-label">OTP Code</label>
          <input class="form-control text-center font-monospace" style="font-size: 1.25rem; letter-spacing: 0.25em; font-weight: 700" name="otp" [(ngModel)]="otp" required minlength="6" maxlength="6" placeholder="123456" />
        </div>

        <div *ngIf="error()" class="alert alert-danger py-2" role="alert">{{ error() }}</div>

        <button type="submit" class="btn btn-primary w-100 py-2 mb-2" [disabled]="otp.length !== 6 || loggingIn()">
          <span *ngIf="loggingIn()">
            <span class="spinner-border spinner-border-sm me-1"></span> Verifying & Logging in...
          </span>
          <span *ngIf="!loggingIn()">
            Verify & Sign In
          </span>
        </button>
        <button type="button" class="btn btn-link w-100 text-muted-2" (click)="step.set(1)">Back</button>
      </form>
    </div>

    <div class="divider"></div>
    <div class="text-center text-muted-2" style="font-size:.9rem">
      New here? <a routerLink="/signup" style="color:var(--ih-primary);font-weight:600">Create an account</a>
    </div>
  </div>
</div>
