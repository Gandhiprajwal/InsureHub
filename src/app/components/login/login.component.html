<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-brand">
      <span class="dot"><i class="bi bi-shield-fill-check"></i></span>
      InsureHub
    </div>
    <h4 class="mb-1" style="font-weight:700;letter-spacing:-.01em">Welcome back</h4>
    <p class="text-muted-2 mb-4">Sign in to manage your policies.</p>

    <div class="role-toggle">
      <button [class.active]="role() === 'agent'" (click)="role.set('agent')">
        <i class="bi bi-briefcase-fill me-1"></i> Agent
      </button>
      <button [class.active]="role() === 'customer'" (click)="role.set('customer')">
        <i class="bi bi-person-fill me-1"></i> Customer
      </button>
    </div>

    <form (ngSubmit)="submit()" #f="ngForm">
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input class="form-control" type="email" name="email" [(ngModel)]="email" required />
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input class="form-control" type="password" name="password" [(ngModel)]="password" required />
      </div>

      @if (error()) {
        <div class="alert alert-danger py-2" role="alert">{{ error() }}</div>
      }

      <button type="submit" class="btn btn-primary w-100 py-2" [disabled]="!f.valid">
        Sign in as {{ role() === 'agent' ? 'Agent' : 'Customer' }}
      </button>
    </form>

    <div class="divider"></div>
    <div class="text-center text-muted-2" style="font-size:.9rem">
      New here? <a routerLink="/signup" style="color:var(--ih-primary);font-weight:600">Create an account</a>
    </div>

    <div class="mt-4 p-3" style="background:#f8fafc;border-radius:10px;font-size:.82rem">
      <div style="font-weight:600;margin-bottom:.25rem">Demo accounts</div>
      <div class="text-muted-2">Agent: agent&#64;demo.com / demo123 (AGT001)</div>
      <div class="text-muted-2">Customer: john&#64;demo.com / demo123</div>
    </div>
  </div>
</div>
